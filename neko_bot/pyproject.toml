[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neko_bot"
version = "0.1.0"
description = "Local-first AI personal productivity bot, CLI harness, and background daemon on Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
neko = "neko_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neko_bot*"]
