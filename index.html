<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII AI Companion // Neko Desktop</title>
  <link rel="stylesheet" href="css/terminal.css" />
</head>
<body>
  <!-- Griglia ASCII Interattiva a 60 FPS -->
  <canvas id="ascii-canvas"></canvas>

  <!-- Sottile filtro scanline / vignettatura terminale -->
  <div class="crt-overlay" id="crt-overlay"></div>

  <!-- Interfaccia HUD Ultra-Minimale -->
  <div class="hud-layer" id="hud-layer">
    <!-- TOP BAR: Compatta in alto a destra (lascia totalmente libera la zona icone di Windows a sinistra) -->
    <div class="hud-top-bar" id="status-matrix-panel">
      <div class="top-bar-section hud-collapsible">
        <span class="status-dot" id="ai-dot"></span>
        <span class="sys-stat">CPU <strong id="cpu-val">15%</strong></span>
        <span class="sys-sep">·</span>
        <span class="sys-stat">RAM <strong id="ram-val">40%</strong></span>
      </div>

      <div class="top-bar-divider hud-collapsible">│</div>

      <!-- Ecosystem Telemetry Section (Cloud Sync, Memory, Skills) -->
      <div class="top-bar-section hud-collapsible" id="hud-ecosystem-section">
        <span class="hud-badge hud-badge-cloud cloud-offline" id="cloud-sync-badge" title="Stato Cloud Sync">[CLOUD: OFFLINE]</span>
        <span class="hud-pill hud-pill-mem" id="mem-pill" title="Memoria Persistente">[MEM: 0f/0p]</span>
        <span class="hud-pill hud-pill-skills" id="skills-pill" title="Abilità Autonome">[SKILLS: 0 active]</span>
      </div>

      <div class="top-bar-divider hud-collapsible">│</div>

      <!-- Stati del Neko -->
      <div class="mode-buttons">
        <button class="term-btn active" data-mode-btn="companion" title="Modalità Neko Companion">● NEKO</button>
        <button class="term-btn" data-mode-btn="ai" title="Modalità AI Coding">⚡ AI</button>
        <button class="term-btn" data-mode-btn="coffee" title="Pausa Caffè">☕ CAFFÈ</button>
        <button class="term-btn" data-mode-btn="afk" title="Standby / Dorme">🌙 AFK</button>
        <button class="term-btn" data-mode-btn="focus" title="Deep Focus">🎯 FOCUS</button>
      </div>

      <div class="top-bar-divider hud-collapsible">│</div>

      <!-- Azioni rapide Neko -->
      <div class="top-bar-section hud-collapsible">
        <button class="term-btn term-btn-sm" id="btn-fish-snack" title="Lancia un pescetto ><(((º> (oppure Tasto Destro sullo sfondo)">
          🐟 SNACK
        </button>
        <button class="term-btn term-btn-sm active" id="btn-face-style" title="Movimento autonomo del Neko">
          🐾 LIBERO
        </button>
      </div>

      <!-- Timer Sessione (visibile quando attivo) -->
      <div class="session-timer-badge" id="session-timer-badge">
        <span id="session-timer-label">⏱</span>
        <strong id="session-timer-val">00:00</strong>
      </div>

      <div class="top-bar-divider">│</div>

      <!-- Orologio + Selettore Schermo + Visibilità HUD -->
      <div class="top-bar-section">
        <span class="clock-inline" id="clock-display">00:00</span>
        <button class="term-btn term-btn-sm hud-collapsible" id="companion-affection" title="Clicca per invertire Schermo 1 / Schermo 2">
          🖥 S1 ★
        </button>
        <button class="term-btn term-btn-sm" id="btn-toggle-hud" title="Cambia visibilità HUD: Completa / Compatta / Zen">
          👁
        </button>
      </div>
    </div>

    <!-- Deadline Alert Toast (Visibile solo se ci sono scadenze ad alto rischio o urgenti) -->
    <div class="hud-deadline-toast" id="hud-deadline-toast" style="display: none;">
      <div class="deadline-toast-header">
        <span class="deadline-toast-icon">⚠️</span>
        <span class="deadline-toast-title">SCADENZA IMMINENTE</span>
        <button class="deadline-toast-close" id="btn-dismiss-deadline" title="Nascondi notifica">×</button>
      </div>
      <div class="deadline-toast-body" id="deadline-toast-content">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Pulsante flottante di ripristino quando l'HUD è in modalità ZEN -->
    <button class="hud-restore-pill" id="btn-restore-hud" title="Ripristina l'interfaccia HUD">
      [ 👁 HUD ]
    </button>

    <!-- BOTTOM TERMINAL: Terminale AI Locale (Ollama) + Tool Rapidi -->
    <div class="ai-terminal-dock hud-collapsible" id="ai-terminal-dock">
      <div class="ai-term-header">
        <div class="ai-term-title">
          <span>&gt;_ NEKO LOCAL AI //</span>
          <span class="ai-model-badge" id="ai-model-badge">OLLAMA</span>
        </div>

        <div class="ai-quick-chips">
          <button class="ai-chip" data-ai-cmd="/sys" title="Mostra i processi che consumano più RAM e stato CPU">
            📊 TOP CPU/RAM
          </button>
          <button class="ai-chip" data-ai-cmd="__timer25__" title="Avvia un timer Focus di 25 minuti">
            ⏱ TIMER 25m
          </button>
          <button class="ai-chip" data-ai-cmd="/todo" title="Mostra la tua lista To-Do locale">
            📝 TO-DO LIST
          </button>
          <button class="ai-chip" id="btn-min-term" title="Riduci/Espandi il terminale AI">
            [▼]
          </button>
        </div>
      </div>

      <div class="ai-term-body" id="ai-term-body">
        <div class="ai-output-line" id="ai-output-line">
          <span class="ai-prefix">neko@local:~$</span>
          <span id="companion-dialogue">Pronto. Usa i controlli rapidi qui sopra (`📊 TOP CPU/RAM`, `⏱ TIMER 25m`, `📝 TO-DO LIST`) o chiedi a Ollama.</span>
        </div>

        <form class="ai-input-row" id="ai-input-form" autocomplete="off">
          <span class="ai-prompt-char">$</span>
          <input
            type="text"
            id="ai-input-field"
            class="ai-input-field"
            placeholder="Chiedi a Ollama locale o usa i comandi '/sys' e 'todo: ...'"
          />
          <button type="submit" class="term-btn term-btn-sm">INVIA ↵</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Moduli JS -->
  <script src="js/ascii-renderer.js"></script>
  <script src="js/fluid-field.js"></script>
  <script src="js/companion-face.js"></script>
  <script src="js/system-bridge.js"></script>
  <script src="js/hud-terminal.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
